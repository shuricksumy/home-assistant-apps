<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="880" height="300" rx="12" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/>
    </marker>
  </defs>

  <!-- Home Assistant host -->
  <rect x="20" y="20" width="520" height="260" rx="10" fill="#eef5fd" stroke="#03a9f4" stroke-width="1.5"/>
  <text x="36" y="44" font-size="14" font-weight="600" fill="#0b6aa2">Home Assistant host</text>

  <rect x="40" y="70" width="140" height="70" rx="8" fill="#fff" stroke="#9aa7b4"/>
  <text x="110" y="98" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2933">Anna opens</text>
  <text x="110" y="116" font-size="13" text-anchor="middle" fill="#1f2933">the sidebar panel</text>

  <rect x="210" y="70" width="140" height="70" rx="8" fill="#fff" stroke="#9aa7b4"/>
  <text x="280" y="94" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2933">Ingress</text>
  <text x="280" y="112" font-size="11.5" text-anchor="middle" fill="#3e4c59">tells the add-on who</text>
  <text x="280" y="128" font-size="11.5" text-anchor="middle" fill="#3e4c59">is signed in: anna</text>

  <rect x="380" y="70" width="145" height="70" rx="8" fill="#fff" stroke="#9aa7b4"/>
  <text x="452" y="94" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2933">This add-on</text>
  <text x="452" y="112" font-size="11.5" text-anchor="middle" fill="#3e4c59">looks up "anna"</text>
  <text x="452" y="128" font-size="11.5" text-anchor="middle" fill="#3e4c59">in ma_users</text>

  <line x1="180" y1="105" x2="206" y2="105" stroke="#5f6b7a" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="350" y1="105" x2="376" y2="105" stroke="#5f6b7a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="380" y="170" width="145" height="90" rx="8" fill="#fffbe6" stroke="#d9a400"/>
  <text x="452" y="192" font-size="12" font-weight="600" text-anchor="middle" fill="#6b4f00">ma_users (admin sets)</text>
  <text x="392" y="214" font-size="11" fill="#3e4c59" font-family="ui-monospace, Menlo, monospace">alex → token A</text>
  <text x="392" y="232" font-size="11" fill="#3e4c59" font-family="ui-monospace, Menlo, monospace" font-weight="700">anna → token B</text>
  <line x1="452" y1="166" x2="452" y2="144" stroke="#d9a400" stroke-width="1.5" stroke-dasharray="4 3"/>

  <text x="40" y="190" font-size="12" fill="#3e4c59">Home Assistant knows who Anna is,</text>
  <text x="40" y="208" font-size="12" fill="#3e4c59">but cannot vouch for her to a Music</text>
  <text x="40" y="226" font-size="12" fill="#3e4c59">Assistant on other hardware. The</text>
  <text x="40" y="244" font-size="12" fill="#3e4c59">mapping bridges that gap.</text>

  <!-- Separate hardware -->
  <rect x="600" y="20" width="260" height="260" rx="10" fill="#f3f0fb" stroke="#7e57c2" stroke-width="1.5"/>
  <text x="616" y="44" font-size="14" font-weight="600" fill="#4f2f99">Separate hardware (NAS…)</text>

  <rect x="625" y="70" width="210" height="70" rx="8" fill="#fff" stroke="#9aa7b4"/>
  <text x="730" y="96" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2933">Music Assistant</text>
  <text x="730" y="116" font-size="12" text-anchor="middle" fill="#3e4c59">token B → signed in as anna</text>

  <line x1="525" y1="105" x2="621" y2="105" stroke="#5f6b7a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="573" y="96" font-size="11" text-anchor="middle" fill="#3e4c59">token B</text>

  <text x="625" y="180" font-size="12" fill="#3e4c59">No trusted link to Home</text>
  <text x="625" y="198" font-size="12" fill="#3e4c59">Assistant: it only trusts its</text>
  <text x="625" y="216" font-size="12" fill="#3e4c59">own users and tokens, so each</text>
  <text x="625" y="234" font-size="12" fill="#3e4c59">person needs their own token.</text>
</svg>
