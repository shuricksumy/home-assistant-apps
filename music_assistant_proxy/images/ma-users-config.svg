<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="720" height="420" rx="12" fill="#f5f5f5"/>

  <!-- tabs -->
  <text x="40" y="40" font-size="14" fill="#5f6b7a">Info</text>
  <text x="100" y="40" font-size="14" fill="#5f6b7a">Documentation</text>
  <text x="225" y="40" font-size="14" font-weight="600" fill="#03a9f4">Configuration</text>
  <rect x="222" y="48" width="100" height="3" fill="#03a9f4"/>
  <text x="345" y="40" font-size="14" fill="#5f6b7a">Log</text>

  <!-- card -->
  <rect x="24" y="66" width="672" height="330" rx="10" fill="#ffffff" stroke="#e0e0e0"/>
  <text x="44" y="100" font-size="18" fill="#1f2933">Options</text>
  <text x="664" y="100" font-size="20" fill="#5f6b7a" text-anchor="middle">⋮</text>
  <rect x="530" y="108" width="150" height="30" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="605" y="128" font-size="12.5" text-anchor="middle" fill="#1f2933">Edit in YAML</text>

  <!-- editor -->
  <rect x="44" y="150" width="632" height="190" rx="6" fill="#fafafa" stroke="#e0e0e0"/>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13.5">
    <text x="60" y="176"><tspan fill="#0b6aa2">server_host</tspan><tspan fill="#1f2933">: 192.168.1.11</tspan></text>
    <text x="60" y="196"><tspan fill="#0b6aa2">server_port</tspan><tspan fill="#1f2933">: 8095</tspan></text>
    <text x="60" y="216"><tspan fill="#0b6aa2">ma_token</tspan><tspan fill="#1f2933">: ""</tspan></text>
    <text x="60" y="236"><tspan fill="#0b6aa2">ma_users</tspan><tspan fill="#1f2933">:</tspan></text>
    <text x="60" y="256"><tspan x="76" fill="#1f2933">-</tspan><tspan x="92" fill="#0b6aa2">ha_user</tspan><tspan fill="#1f2933">: alex</tspan><tspan x="380" fill="#8a949e"># Home Assistant username</tspan></text>
    <text x="60" y="276"><tspan x="92" fill="#0b6aa2">ma_token</tspan><tspan fill="#1f2933">: </tspan><tspan fill="#2e7d32">"eyJhbGciOi…"</tspan><tspan x="380" fill="#8a949e"># alex's MA token</tspan></text>
    <text x="60" y="296"><tspan x="76" fill="#1f2933">-</tspan><tspan x="92" fill="#0b6aa2">ha_user</tspan><tspan fill="#1f2933">: anna</tspan></text>
    <text x="60" y="316"><tspan x="92" fill="#0b6aa2">ma_token</tspan><tspan fill="#1f2933">: </tspan><tspan fill="#2e7d32">"eyJ0eXAiOi…"</tspan><tspan x="380" fill="#8a949e"># anna's MA token</tspan></text>
  </g>

  <rect x="606" y="352" width="70" height="32" rx="6" fill="#03a9f4"/>
  <text x="641" y="373" font-size="13" font-weight="600" text-anchor="middle" fill="#ffffff">SAVE</text>
</svg>
