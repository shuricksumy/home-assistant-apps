# Settings for the SPA entrypoint, the response both page rewrites depend on.
#
# MA serves the index with ETag and Last-Modified. Left alone, the browser
# revalidates and MA answers 304 with an empty body -- and sub_filter can only
# rewrite a body, so the rewrites silently never reach a returning visitor.
# Strip the conditional request headers so the upstream always sends a full 200,
# and stop the browser caching the result so it cannot go stale again.

proxy_set_header If-None-Match "";
proxy_set_header If-Modified-Since "";

proxy_hide_header ETag;
proxy_hide_header Last-Modified;
proxy_hide_header Cache-Control;
add_header Cache-Control "no-store" always;

# sub_filter cannot match a compressed body.
proxy_set_header Accept-Encoding "";

# The main bundle is served with no Cache-Control at all, just a validator, so a
# browser that already holds the unpatched copy would revalidate into a 304 and
# keep using it. Point the tag at a URL it has never seen, so the patched copy
# from /assets/ is fetched. Bump the value if the patch itself changes.
sub_filter '.js"></script>' '.js?maproxy=1"></script>';

# Optional auto-login seed, generated at boot from the ma_token option.
include /etc/nginx/inject.conf;
