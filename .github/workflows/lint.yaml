name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  find:
    name: Find apps
    runs-on: ubuntu-latest
    outputs:
      addons: ${{ steps.addons.outputs.addons_list }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Find app directories
        id: addons
        uses: home-assistant/actions/helpers/find-addons@86d4564712fa02543c808e3a693dd04f9d3f8361 # master

  lint:
    name: Lint ${{ matrix.path }}
    runs-on: ubuntu-latest
    needs: find
    strategy:
      matrix:
        path: ${{ fromJson(needs.find.outputs.addons) }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Validates config.json, build.yaml and the Dockerfile against the
      # add-on schema. This is the same linter the official example repo runs.
      - name: Run Home Assistant app linter
        uses: frenck/action-app-linter@b9cfd1bc62ba60d2c4fc96317b5f7ada5923f4a7 # v2.21.1
        with:
          path: "./${{ matrix.path }}"

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The s6 service scripts use a with-contenv shebang that shellcheck does
      # not recognise, so each carries a "shellcheck shell=bash" directive.
      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0

  # The one check the main-branch ruleset requires: the lint matrix is built
  # from the app directories, so its job names change whenever an app is added
  # or removed. Renovate merges its own PRs once this passes.
  result:
    name: Lint result
    if: always()
    needs: [find, lint, shellcheck]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every lint job passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
