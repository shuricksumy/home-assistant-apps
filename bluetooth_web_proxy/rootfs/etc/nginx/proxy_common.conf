# Shared proxy settings, included by every location.
#
# These live in a file rather than at server level on purpose: nginx inherits
# proxy_set_header from an outer level only when the inner level declares none
# of its own. Any location adding a single header would silently drop all of
# these, so each location includes the full set instead.

include /etc/nginx/upstream.conf;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# A scan blocks its request for its full duration (up to 60s), and pairing waits
# on a physical device. The 60s default would cut those off mid-operation.
proxy_connect_timeout 15s;
proxy_send_timeout 300s;
proxy_read_timeout 300s;
